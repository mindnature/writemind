name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate Han Yu bootstrap
        run: python scripts/writemind.py validate --writer han-yu
      - name: Build bootstrap advisor
        run: python scripts/writemind.py build-skill --writer han-yu
